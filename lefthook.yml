pre-push:
  parallel: true
  commands:
    eslint:
      run: pnpm eslint --no-warn-ignored {push_files}
    prettier:
      run: pnpm prettier --check --ignore-unknown --no-error-on-unmatched-pattern {push_files}
    spellcheck:
      run: pnpm cspell --exclude '**/.*' --no-must-find-files {push_files}
    knip:
      run: nr knip
    types:
      run: nr lint:ts
    build:
      run: nr build:code:test && nr check:dts:no-devdeps-imports
    config:
      run: nr check:config
    peers:
      glob: '{package.json,pnpm-lock.yaml,pnpm-workspace.yaml}'
      run: nr deps:peers:check

post-merge: &install-on-lockfile-change
  commands:
    install:
      glob: '{pnpm-lock.yaml,pnpm-workspace.yaml,patches/*}'
      run: ni
post-checkout: *install-on-lockfile-change

pre-commit:
  parallel: true
  skip: [merge, rebase]
  commands:
    prettier:
      run: pnpm exec prettier --write --ignore-unknown --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {0}
