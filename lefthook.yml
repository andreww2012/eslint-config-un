pre-push:
  parallel: true
  commands:
    eslint:
      run: pnpm exec eslint --config eslint.config.ts --no-warn-ignored {push_files}
    oxfmt:
      run: pnpm exec oxfmt --check --no-error-on-unmatched-pattern {push_files}
    cspell:
      run: pnpm exec cspell --exclude '**/.*' --no-must-find-files {push_files}
    knip:
      run: nr knip
    types:
      run: nr ts
    build:
      run: nr build:code:test && nr check:dts:no-devdeps-imports
    config:
      run: nr check:config
    type-info:
      glob: '{pnpm-lock.yaml,src/plugins/*.ts}'
      run: nr check:type-info
    peers:
      glob: '{package.json,pnpm-lock.yaml,pnpm-workspace.yaml}'
      run: nr check:deps:peers

post-merge: &install-on-lockfile-change
  commands:
    install:
      glob: '{pnpm-lock.yaml,pnpm-workspace.yaml,patches/*}'
      run: ni
post-checkout: *install-on-lockfile-change

pre-commit:
  parallel: true
  skip: [merge, rebase]
  commands:
    oxfmt:
      run: pnpm exec oxfmt --write --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {0}
