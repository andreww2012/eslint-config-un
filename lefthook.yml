pre-push:
  parallel: true
  commands:
    eslint:
      run: pnpm eslint {push_files}
    prettier:
      run: pnpm prettier --check --ignore-unknown {push_files}
    spellcheck:
      run: pnpm cspell --exclude '**/.*' --no-must-find-files {push_files}
    knip:
      run: nr knip
    types:
      run: nr lint:types:go
    build:
      run: nr build:code:test
commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {0}
