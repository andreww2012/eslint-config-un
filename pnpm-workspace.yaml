packages:
  - ./

nodeLinker: hoisted
packageImportMethod: clone-or-copy
saveExact: true

minimumReleaseAge: 960 # 16 hours in minutes
minimumReleaseAgeExclude: # []
  - eslint-plugin-unicorn@71.0.0
# - '@typescript-eslint/eslint-plugin@X.Y.Z'
# - '@typescript-eslint/parser@X.Y.Z'
# - '@typescript-eslint/project-service@X.Y.Z'
# - '@typescript-eslint/scope-manager@X.Y.Z'
# - '@typescript-eslint/tsconfig-utils@X.Y.Z'
# - '@typescript-eslint/type-utils@X.Y.Z'
# - '@typescript-eslint/types@X.Y.Z'
# - '@typescript-eslint/typescript-estree@X.Y.Z'
# - '@typescript-eslint/utils@X.Y.Z'
# - '@typescript-eslint/visitor-keys@X.Y.Z'
# - typescript-eslint@X.Y.Z

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200 # 30 days in minutes
trustPolicyExclude:
  # []
  - tinyexec@1.2.2 # Uses staged publishing instead of trusted publishing

auditConfig:
  ignoreGhsas:
    # Sets vulnerable versions of `@tanstack/eslint-plugin-start` to >=0, but actually vulnerable versions are not installed
    - GHSA-8hwj-wqhq-3xw2

allowBuilds:
  '@parcel/watcher@2.5.6': false
  esbuild@0.27.7: true
  esbuild@0.28.0: true
  lefthook@2.1.9: true
  msgpackr-extract@3.0.4: false
  multiline-ts@4.0.1: false
  nx@23.0.1: false
  puppeteer@25.3.0: true
  unrs-resolver@1.12.2: true

dedupePeers: true
strictPeerDependencies: false

overrides:
  '@eslint/config-inspector>h3@<=1.15.4': ^1.15.5
  '@isaacs/brace-expansion@<=5.0.0': '>=5.0.1'
  tar@<7.5.7: ^7.5.7
  axios@>=1.0.0 <1.15.2: ^1.15.2
  eslint-plugin-arrow-return-style-x>@typescript-eslint/utils: ^8.56.0

patchedDependencies:
  '@eslint/compat@2.1.0': patches/@eslint__compat@2.1.0.patch
  eslint-plugin-node-dependencies: patches/eslint-plugin-node-dependencies.patch
  eslint-plugin-prettier@5.5.6: patches/eslint-plugin-prettier@5.5.6.patch
  import-meta-resolve: patches/import-meta-resolve.patch
  npm-check-updates: patches/npm-check-updates.patch

peerDependencyRules:
  allowedVersions:
    '@angular-eslint/eslint-plugin-template>eslint': '*'
    '@angular-eslint/eslint-plugin-template@15>@typescript-eslint/utils': '*'
    '@angular-eslint/eslint-plugin-template@15>eslint': '*'
    '@angular-eslint/utils@15>eslint': '*'
    '@angular-eslint/utils@17>eslint': '*'

    '@typescript-eslint/project-service@8.38>typescript': '*'
    '@typescript-eslint/tsconfig-utils@8.38>typescript': '*'
    '@typescript-eslint/type-utils@7>eslint': '*'
    '@typescript-eslint/typescript-estree@8.38>typescript': '*'
    '@typescript-eslint/utils@7>eslint': '*'
    '@typescript-eslint/utils@8.38>typescript': '*'
    '@typescript-eslint/parser@8.57.0>typescript': '>=5'

    eslint-plugin-no-type-assertion@1.3>eslint: '*'
    '@intlify/eslint-plugin-vue-i18n@4.3.0>yaml-eslint-parser': ^2.0.0

    '@eslint-react/eslint@^5>eslint': '>=9'
    '@eslint-react/eslint-plugin@^5>eslint': '>=9'
    '@eslint-react/shared@^5>eslint': '>=9'
    eslint-plugin-react-dom@^5>eslint: '>=9'
    '@eslint-react/ast@^5>eslint': '>=9'
    '@eslint-react/core@^5>eslint': '>=9'
    '@eslint-react/jsx@^5>eslint': '>=9'
    '@eslint-react/var@^5>eslint': '>=9'
    eslint-plugin-react-jsx@^5>eslint: '>=9'
    eslint-plugin-react-naming-convention@^5>eslint: '>=9'
    eslint-plugin-react-rsc@^5>eslint: '>=9'
    eslint-plugin-react-web-api@^5>eslint: '>=9'
    eslint-plugin-react-x@^5>eslint: '>=9'
    eslint-plugin-react-debug@^5>eslint: '>=9'
    eslint-plugin-file-progress@^5>eslint: '>=9'
    eslint-plugin-ava@16.0.1>eslint: '>=9'
    eslint-plugin-unicorn>eslint: '>=9'
    eslint-plugin-astro@^2>eslint: '>=9'

    '@phenomnomnominal/tsquery@6.1.4>typescript': '>=5'
    '@sveltejs/vite-plugin-svelte@7.0.0>vite': '>=7'
