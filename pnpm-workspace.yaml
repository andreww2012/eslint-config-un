# `ncu` only updates catalogs in workspace mode, which needs this
packages:
  - ./

nodeLinker: hoisted
packageImportMethod: clone-or-copy
saveExact: true
autoDedupe: true
saveTypes: true

minimumReleaseAge: 960 # 16 hours in minutes
minimumReleaseAgeStrict: false # Auto-adds too-new versions to the exclude list instead of prompting or failing
minimumReleaseAgeExclude: # []
  - '@eslint-react/ast@5.24.6'
  - '@eslint-react/core@5.24.6'
  - '@eslint-react/eslint-plugin@5.24.6'
  - '@eslint-react/eslint@5.24.6'
  - '@eslint-react/jsx@5.24.6'
  - '@eslint-react/shared@5.24.6'
  - '@eslint-react/var@5.24.6'
  - eslint-plugin-react-debug@5.24.6
  - eslint-plugin-react-dom@5.24.6
  - eslint-plugin-react-jsx@5.24.6
  - eslint-plugin-react-naming-convention@5.24.6
  - eslint-plugin-react-rsc@5.24.6
  - eslint-plugin-react-web-api@5.24.6
  - eslint-plugin-react-x@5.24.6
  - eslint-plugin-better-tailwindcss@4.9.0
  - eslint-plugin-ava@18.0.0
  - '@andreww2012/unutils@0.2.0'
minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200 # 30 days in minutes
trustPolicyExclude: # []
  - cssnano@9.3.1

audit:
  ignore: # []
    - GHSA-ggr8-5vv4-36mx # Can't safely override the version resulting in major version number change
    - GHSA-86w9-cpqp-85rv # No patched `node-forge` yet; `listhen` only generates certificates with it, never verifies signatures
    - GHSA-vfj7-8cjw-p6xm # No patched `braces` yet; dev-only, and glob patterns come from trusted configs
    - GHSA-x6jw-m9v5-85vh # Patched only in `simple-git` v4, which drops the default export `@nuxt/devtools` imports; dev-only, and devtools never runs here
    - GHSA-g4wm-2vf7-vfgr # Patched only in `simple-git` v4, which drops the default export `@nuxt/devtools` imports; dev-only, and devtools never runs here
    - GHSA-858h-whjf-mvg5 # Patched only in `simple-git` v4, which drops the default export `@nuxt/devtools` imports; dev-only, and devtools never runs here
    - GHSA-v5rq-49vh-5v5c # Patched only in `simple-git` v4, which drops the default export `@nuxt/devtools` imports; dev-only, and devtools never runs here
  ignorePrune: true

allowBuilds:
  # Replaces the shipped `esbuild` binary (which is a Node.js script) with a hardlink to the native executable - not strictly needed even if we actually used `esbuild` from cli
  esbuild@0.28.2: true
  # Critical: sets up git hooks
  lefthook@2.1.17: true

  # Script body is guarded by `process.env.npm_config_build_from_source === 'true'`
  '@parcel/watcher': false
  # Runs an optional build-from-source compilation step using `node-gyp-build-optional-packages`
  # (uses the prebuilt `.node` instead)
  msgpackr-extract: false
  # Dev only script to enforce a package manager
  multiline-ts: false
  # Not relevant for us - present transitively via `@nx/eslint-plugin`
  nx: false
  # Chrome is only downloaded upon launching the script(s) that actually use it, to save disk space
  puppeteer: false
  # Runs `napi-postinstall`, which is an optional deps checker for legacy npm versions
  unrs-resolver: false

dedupePeers: true
strictPeerDependencies: false

catalogs:
  format:
    oxfmt: 0.72.0

overrides:
  # 11 and 12 only break executor helpers and subgraph schema printing, neither used by `@graphql-eslint/eslint-plugin`
  '@graphql-tools/utils@<12.0.1': 12.0.3
  axios@>=1.13.0 <1.20.0: 1.20.0
  # 6.0.0's only breaking change (separate transfer hosts are opt-in) doesn't affect `get-uri`
  basic-ftp@<6.2.1: 6.2.1
  brace-expansion@>=5.0.0 <5.0.12: 5.0.12
  eslint-plugin-arrow-return-style-x>@typescript-eslint/utils: ^8.56.0
  # Format Markdown code blocks with the same oxfmt version as all other files
  eslint-plugin-format>oxfmt: 'catalog:format'
  # 2.0.7 dropped the `.js` files the plugin imports
  eslint-plugin-formatjs>@unicode/unicode-17.0.0: 2.0.6
  smol-toml@<=1.7.0: ^1.7.1
  tinypool@<2.1.2: 2.2.0
  undici@>=7.0.0 <7.29.1: 7.30.0

patchedDependencies:
  '@eslint/compat': patches/@eslint__compat.patch
  eslint-plugin-file-progress@4.0.0: patches/eslint-plugin-file-progress@4.0.0.patch
  eslint-plugin-node-dependencies: patches/eslint-plugin-node-dependencies.patch
  eslint-plugin-prettier@5.5.6: patches/eslint-plugin-prettier@5.5.6.patch
  eslint-typegen: patches/eslint-typegen.patch
  import-meta-resolve: patches/import-meta-resolve.patch
  npm-check-updates: patches/npm-check-updates.patch

peerDependencyRules:
  allowedVersions:
    '@angular-eslint/eslint-plugin-template@15>@typescript-eslint/utils': '*'
    '@angular-eslint/eslint-plugin-template@15>eslint': '*'
    '@angular-eslint/eslint-plugin-template@17>eslint': '*'
    '@angular-eslint/eslint-plugin@18>eslint': '*'
    '@angular-eslint/utils@15>eslint': '*'
    '@angular-eslint/utils@17>eslint': '*'
    '@angular-eslint/utils@18>eslint': '*'

    '@typescript-eslint/project-service@8.56>typescript': '*'
    '@typescript-eslint/tsconfig-utils@8.56>typescript': '*'
    '@typescript-eslint/type-utils@7>eslint': '*'
    '@typescript-eslint/typescript-estree@8.56>typescript': '*'
    '@typescript-eslint/utils@5>eslint': '*'
    '@typescript-eslint/utils@7>eslint': '*'
    '@typescript-eslint/utils@8.56>typescript': '*'
    '@typescript-eslint/parser@8.57.0>typescript': '>=5'

    eslint-plugin-no-type-assertion@1.3>eslint: '*'
    '@intlify/eslint-plugin-vue-i18n@4.3.0>yaml-eslint-parser': ^2.0.0

    '@tanstack/eslint-plugin-start@^0.1>eslint': '>=10'
    eslint-plugin-jest-extended@^3>eslint: '>=10'
    eslint-plugin-react@^7>eslint: '>=10'

    '@phenomnomnominal/tsquery@6.1.4>typescript': '>=5'
    '@ts-safeql/plugin-utils@5.3>typescript': '>=5'

    # Optional peer, unused here; crossws@0.4 comes in via h3@2 (wants ^0.4.1)
    graphql-ws@6>crossws: ^0.4

    # Shell completions for `@nuxt/cli`, never run here; cac@7 is what our other dev tools need
    '@bomb.sh/tab@0.0>cac': ^7
