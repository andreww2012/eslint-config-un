# Makes npm-check-updates update the catalogs too
packages:
  - ./

nodeLinker: hoisted
packageImportMethod: clone-or-copy
saveExact: true
autoDedupe: true
saveTypes: true
lockfile:
  # Records `autoDedupe`, so that installs don't resolve the lockfile again
  includeResolutionSettings: true

minimumReleaseAge: 960 # 16 hours in minutes
minimumReleaseAgeStrict: false # Auto-adds too-new versions to the exclude list instead of prompting or failing
minimumReleaseAgeExclude: []
minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200 # 30 days in minutes
trustPolicyExclude: # []
  - chromium-bidi@157.0.8090-0
  - lefthook@2.2.2
  - seroval@1.7.2

audit:
  ignore: # []
    - GHSA-ggr8-5vv4-36mx # Can't safely override the version resulting in major version number change
    - GHSA-86w9-cpqp-85rv # No patched `node-forge` yet; `listhen` only generates certificates with it, never verifies signatures
  ignorePrune: true

allowBuilds:
  # Replaces the shipped `esbuild` binary (which is a Node.js script) with a hardlink to the native
  # executable - not strictly needed even if we actually used `esbuild` from cli
  esbuild@0.28.2: true
  # Critical: sets up git hooks
  lefthook@2.2.2: true

  # Script body is guarded by `process.env.npm_config_build_from_source === 'true'`
  '@parcel/watcher': false
  # Dev only script to enforce a package manager
  multiline-ts: false
  # Not relevant for us - present transitively via `@nx/eslint-plugin`
  nx: false
  # Chrome is only downloaded upon launching the script(s) that actually use it, to save disk space
  puppeteer: false
  # Runs `napi-postinstall`, which is an optional deps checker for legacy npm versions
  unrs-resolver: false

dedupePeers: true
strictPeerDependencies: false

catalogs:
  html-scripts:
    '@eslint/plugin-kit': 0.7.3
    css-selector-parser: 3.3.0
    eslint-scope: 9.1.2
    eslint-visitor-keys: 5.0.1
    espree: 11.2.0
    htmlparser2: 12.0.0

overrides:
  # 11 and 12 only break executor helpers and subgraph schema printing, neither used by
  # `@graphql-eslint/eslint-plugin`
  '@graphql-tools/utils@<12.0.1': 12.1.0
  # 6.0.0's only breaking change (separate transfer hosts are opt-in) doesn't affect `get-uri`
  basic-ftp@<6.2.1: 6.2.1
  eslint-plugin-arrow-return-style-x>@typescript-eslint/utils: ^8.56.0
  undici@>=7.0.0 <7.30.1: 7.30.1

patchedDependencies:
  '@eslint/compat': patches/@eslint__compat.patch
  eslint-plugin-file-progress@4.0.0: patches/eslint-plugin-file-progress@4.0.0.patch
  eslint-typegen: patches/eslint-typegen.patch
  import-meta-resolve: patches/import-meta-resolve.patch
  npm-check-updates: patches/npm-check-updates.patch
  stylelint-config-clean-order@10.0.0: patches/stylelint-config-clean-order@10.0.0.patch

peerDependencyRules:
  allowedVersions:
    '@angular-eslint/eslint-plugin-template@15>eslint': '*'
    '@angular-eslint/eslint-plugin-template@17>eslint': '*'
    '@angular-eslint/eslint-plugin@18>eslint': '*'
    '@angular-eslint/utils@15>eslint': '*'
    '@angular-eslint/utils@17>eslint': '*'
    '@angular-eslint/utils@18>eslint': '*'

    '@typescript-eslint/project-service@8.56>typescript': '*'
    '@typescript-eslint/tsconfig-utils@8.56>typescript': '*'
    '@typescript-eslint/type-utils@7>eslint': '*'
    '@typescript-eslint/typescript-estree@8.56>typescript': '*'
    '@typescript-eslint/utils@5>eslint': '*'
    '@typescript-eslint/utils@7>eslint': '*'
    '@typescript-eslint/utils@8.56>typescript': '*'

    '@tanstack/eslint-plugin-start@^0.1>eslint': '>=10'
    eslint-plugin-jest-extended@^3>eslint: '>=10'
    eslint-plugin-react@^7>eslint: '>=10'

packageExtensions:
  # We only inline their property lists, and an installed `stylelint` would turn off our `css` config
  stylelint-config-clean-order:
    peerDependenciesMeta:
      stylelint: {optional: true}
      stylelint-order: {optional: true}
  stylelint-config-recess-order:
    peerDependenciesMeta:
      stylelint: {optional: true}
      stylelint-order: {optional: true}
