# Makes npm-check-updates update the catalogs too
packages:
  - ./

nodeLinker: hoisted
packageImportMethod: clone-or-copy
saveExact: true
autoDedupe: true
saveTypes: true
lockfile:
  # Records `autoDedupe`, so that installs don't resolve the lockfile again
  includeResolutionSettings: true

minimumReleaseAge: 960 # 16 hours in minutes
minimumReleaseAgeStrict: false # Auto-adds too-new versions to the exclude list instead of prompting or failing
minimumReleaseAgeExclude: # []
  - eslint-plugin-import-x@4.18.1
  - import-integrity-lint@2.1.0
  - '@oxfmt/binding-android-arm-eabi@0.78.0'
  - '@oxfmt/binding-android-arm64@0.78.0'
  - '@oxfmt/binding-darwin-arm64@0.78.0'
  - '@oxfmt/binding-darwin-x64@0.78.0'
  - '@oxfmt/binding-freebsd-x64@0.78.0'
  - '@oxfmt/binding-linux-arm-gnueabihf@0.78.0'
  - '@oxfmt/binding-linux-arm-musleabihf@0.78.0'
  - '@oxfmt/binding-linux-arm64-gnu@0.78.0'
  - '@oxfmt/binding-linux-arm64-musl@0.78.0'
  - '@oxfmt/binding-linux-ppc64-gnu@0.78.0'
  - '@oxfmt/binding-linux-riscv64-gnu@0.78.0'
  - '@oxfmt/binding-linux-riscv64-musl@0.78.0'
  - '@oxfmt/binding-linux-s390x-gnu@0.78.0'
  - '@oxfmt/binding-linux-x64-gnu@0.78.0'
  - '@oxfmt/binding-linux-x64-musl@0.78.0'
  - '@oxfmt/binding-openharmony-arm64@0.78.0'
  - '@oxfmt/binding-win32-arm64-msvc@0.78.0'
  - '@oxfmt/binding-win32-ia32-msvc@0.78.0'
  - '@oxfmt/binding-win32-x64-msvc@0.78.0'
  - oxfmt@0.78.0
  - eslint-mdx@3.9.4
  - eslint-plugin-mdx@3.9.4
  - eslint-plugin-qwik@1.20.4
  - ci-info@4.5.0
  - '@typescript-eslint/eslint-plugin@8.72.2'
  - '@typescript-eslint/parser@8.72.2'
  - '@typescript-eslint/project-service@8.72.2'
  - '@typescript-eslint/scope-manager@8.72.2'
  - '@typescript-eslint/tsconfig-utils@8.72.2'
  - '@typescript-eslint/type-utils@8.72.2'
  - '@typescript-eslint/types@8.72.2'
  - '@typescript-eslint/typescript-estree@8.72.2'
  - '@typescript-eslint/utils@8.72.2'
  - '@typescript-eslint/visitor-keys@8.72.2'
  - typescript-eslint@8.72.2
  - '@pnpm/exe.android-arm64@12.19.0'
  - '@pnpm/exe.android-x64@12.19.0'
  - '@pnpm/exe.darwin-arm64@12.19.0'
  - '@pnpm/exe.darwin-x64@12.19.0'
  - '@pnpm/exe.freebsd-x64@12.19.0'
  - '@pnpm/exe.linux-arm64-musl@12.19.0'
  - '@pnpm/exe.linux-arm64@12.19.0'
  - '@pnpm/exe.linux-ppc64@12.19.0'
  - '@pnpm/exe.linux-riscv64@12.19.0'
  - '@pnpm/exe.linux-s390x@12.19.0'
  - '@pnpm/exe.linux-x64-musl@12.19.0'
  - '@pnpm/exe.linux-x64@12.19.0'
  - '@pnpm/exe.netbsd-x64@12.19.0'
  - '@pnpm/exe.win32-arm64@12.19.0'
  - '@pnpm/exe.win32-x64@12.19.0'
  - pnpm@12.19.0
  - '@eslint-react/ast@5.30.1'
  - '@eslint-react/core@5.30.1'
  - '@eslint-react/eslint-plugin@5.30.1'
  - '@eslint-react/eslint@5.30.1'
  - '@eslint-react/jsx@5.30.1'
  - '@eslint-react/shared@5.30.1'
  - '@eslint-react/var@5.30.1'
  - eslint-plugin-react-debug@5.30.1
  - eslint-plugin-react-dom@5.30.1
  - eslint-plugin-react-jsx@5.30.1
  - eslint-plugin-react-naming-convention@5.30.1
  - eslint-plugin-react-rsc@5.30.1
  - eslint-plugin-react-web-api@5.30.1
  - eslint-plugin-react-x@5.30.1
  - eslint-plugin-better-tailwindcss@4.11.0
  - '@effect/platform-node-shared@4.1.3'
  - '@effect/platform-node@4.1.3'
  - effect@4.1.3
  - '@next/eslint-plugin-next@16.4.6'
  - eslint-plugin-vue@10.12.1
minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200 # 30 days in minutes
trustPolicyExclude: # []
  - lefthook@2.2.2

audit:
  ignore: # []
    - GHSA-ggr8-5vv4-36mx # Can't safely override the version resulting in major version number change
  ignorePrune: true

allowBuilds:
  # Replaces the shipped `esbuild` binary (which is a Node.js script) with a hardlink to the native
  # executable - not strictly needed even if we actually used `esbuild` from cli
  esbuild@0.28.2: true
  # Critical: sets up git hooks
  lefthook@2.2.2: true

  # Script body is guarded by `process.env.npm_config_build_from_source === 'true'`
  '@parcel/watcher': false
  # Dev only script to enforce a package manager
  multiline-ts: false
  # Not relevant for us - present transitively via `@nx/eslint-plugin`
  nx: false
  # Chrome is only downloaded upon launching the script(s) that actually use it, to save disk space
  puppeteer: false

dedupePeers: true
strictPeerDependencies: false

catalogs:
  html-scripts:
    '@eslint/plugin-kit': 0.7.3
    css-selector-parser: 3.3.0
    eslint-scope: 9.1.2
    eslint-visitor-keys: 5.0.1
    espree: 11.2.0
    htmlparser2: 12.0.0
  node-dependencies:
    eslint-json-compat-utils: 0.2.3
    jsonc-eslint-parser: 3.3.0
    npm-package-arg: 14.0.0
    package-json: 10.0.1
    undici: 7.30.2

overrides:
  # 11 and 12 only break executor helpers and subgraph schema printing, neither used by
  # `@graphql-eslint/eslint-plugin`
  '@graphql-tools/utils@<12.0.1': 12.1.0
  # 6.0.0's only breaking change (separate transfer hosts are opt-in) doesn't affect `get-uri`
  basic-ftp@<6.2.1: 6.2.1
  eslint-plugin-arrow-return-style-x>@typescript-eslint/utils: ^8.56.0

patchedDependencies:
  '@eslint/compat': patches/@eslint__compat.patch
  eslint-plugin-file-progress@4.0.0: patches/eslint-plugin-file-progress@4.0.0.patch
  eslint-plugin-node-dependencies@2.3.0: patches/eslint-plugin-node-dependencies@2.3.0.patch
  eslint-typegen: patches/eslint-typegen.patch
  import-meta-resolve: patches/import-meta-resolve.patch
  npm-check-updates: patches/npm-check-updates.patch
  stylelint-config-clean-order@10.0.0: patches/stylelint-config-clean-order@10.0.0.patch

peerDependencyRules:
  allowedVersions:
    '@angular-eslint/eslint-plugin-template@15>eslint': '*'
    '@angular-eslint/eslint-plugin-template@17>eslint': '*'
    '@angular-eslint/eslint-plugin@18>eslint': '*'
    '@angular-eslint/utils@15>eslint': '*'
    '@angular-eslint/utils@17>eslint': '*'
    '@angular-eslint/utils@18>eslint': '*'

    '@typescript-eslint/project-service@8.56>typescript': '*'
    '@typescript-eslint/tsconfig-utils@8.56>typescript': '*'
    '@typescript-eslint/type-utils@7>eslint': '*'
    '@typescript-eslint/typescript-estree@8.56>typescript': '*'
    '@typescript-eslint/utils@5>eslint': '*'
    '@typescript-eslint/utils@7>eslint': '*'
    '@typescript-eslint/utils@8.56>typescript': '*'

    '@tanstack/eslint-plugin-start@^0.1>eslint': '>=10'
    eslint-plugin-jest-extended@^3>eslint: '>=10'
    eslint-plugin-react@^7>eslint: '>=10'

packageExtensions:
  # We only inline their property lists, and an installed `stylelint` would turn off our `css` config
  stylelint-config-clean-order:
    peerDependenciesMeta:
      stylelint: {optional: true}
      stylelint-order: {optional: true}
  stylelint-config-recess-order:
    peerDependenciesMeta:
      stylelint: {optional: true}
      stylelint-order: {optional: true}
