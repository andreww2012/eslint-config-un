nodeLinker: hoisted

onlyBuiltDependencies:
  - esbuild
  - lefthook
  - unrs-resolver

overrides:
  '@eslint/plugin-kit@0.3.5>@eslint/core': 0.17.0
  glob@>=10.2.0 <10.5.0: 10.5.0

packageImportMethod: clone-or-copy

patchedDependencies:
  eslint-plugin-prettier: patches/eslint-plugin-prettier.patch
  import-meta-resolve: patches/import-meta-resolve.patch
  is-in-editor: patches/is-in-editor.patch

peerDependencyRules:
  allowedVersions:
    '@angular-eslint/eslint-plugin-template>eslint': '*'
    '@angular-eslint/eslint-plugin-template@15>@typescript-eslint/utils': '*'
    '@angular-eslint/eslint-plugin-template@15>eslint': '*'
    '@angular-eslint/utils@15>eslint': '*'
    '@angular-eslint/utils@17>eslint': '*'
    '@typescript-eslint/project-service@8.38>typescript': '*'
    '@typescript-eslint/tsconfig-utils@8.38>typescript': '*'
    '@typescript-eslint/type-utils@7>eslint': '*'
    '@typescript-eslint/typescript-estree@8.38>typescript': '*'
    '@typescript-eslint/utils@5>eslint': '*'
    '@typescript-eslint/utils@7>eslint': '*'
    '@typescript-eslint/utils@8.38>typescript': '*'
    eslint-plugin-no-type-assertion@1.3>eslint: '*'

trustPolicy: no-downgrade
trustPolicyExclude:
  - '@angular-eslint/bundled-angular-compiler@17.5.3'
  - '@angular-eslint/eslint-plugin-template@17.5.3'
  - '@angular-eslint/utils@17.5.3'
  - '@graphql-eslint/eslint-plugin@4.4.0'
  - '@graphql-tools/batch-execute@9.0.19'
  - '@graphql-tools/delegate@10.2.23'
  - '@graphql-tools/executor-http@1.3.3'
  - '@graphql-tools/executor-graphql-ws@2.0.7'
  - '@graphql-tools/wrap@10.1.4'
  - '@typescript-eslint/typescript-estree@7.11.0'
  - '@typescript-eslint/scope-manager@7.11.0'
  - '@typescript-eslint/type-utils@7.11.0'
  - '@typescript-eslint/types@7.11.0'
  - '@typescript-eslint/utils@7.11.0'
  - '@typescript-eslint/visitor-keys@7.11.0'
  - cached-factory@0.1.0
  - chokidar@4.0.3
  - detect-port@1.6.1
  - rxjs@7.8.2
  - semver@6.3.1
  - synckit@0.10.4
  - tailwindcss@3.4.17
  - undici-types@6.21.0
  - undici@6.21.3
