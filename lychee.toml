# cspell:ignore Wayback
#:schema https://www.schemastore.org/lychee.json
#
# Repo-specific overrides layered on top of `lychee-config-nick2bad4u`, which is
# always passed first (see `check-links.yml`).
# Scalars here win over the baseline, list values are merged into it.

# Report broken links only. The baseline's "info" also streams a line per working
# link, and "warn" still streams excluded ones. Note that this leaves a local run
# printing nothing at all: the results go to the baseline's `output` file, and
# lychee never announces where that is. In CI the action supplies its own
# `--output` and echoes the report to the job log.
# verbose = "error"

# Reject redirects instead of following them: with a limit of 0 lychee returns
# the 3xx itself, which is not in `accept`, so a moved link fails loudly instead
# of silently passing as its redirect target.
max_redirects = 0

# Wayback snapshots are not a useful answer to a rejected redirect: the archived
# copy is suggested instead of the URL the link actually moved to.
suggest = false
remap = [
  '^https://npmx\.dev/((?:[\w.-]+|@[\w.-]+/[\w.-]+)(?:\?[^/]*)?)$ https://npmx.dev/package/$1',

  # One-offs:
  # Link with a redirect inside an inline snapshot
  '^https://github\.com/es-tooling(/module-replacements(?:/.*)?)$ https://github.com/e18e$1',
  # The site redirects links with anchors, despite them being valid
  '^(https://v2\.remix\.run/[^#]*?)/?#[^/]* $1/',
  # New GitHub repo issue page redirects crawlers (non-auth users)
  '^(https://github\.com/[^/#]+/[^/#]+)/issues/new(?:\?.*)?$ $1/issues',

  # Drop anchors lychee cannot verify because they are inserted by JS after load;
  # the fragment-less page is valid
  '^(https://github\.com/[\w.-]+/[\w.-]+/(?:issues|pull)/\d+)#issuecomment-\d+$ $1',
  '^(https://npmx\.dev/package-code/(?:@[\w.-]+/)?[\w.-]+/v/[\w.-]+/[\w./-]+)#L\d+$ $1',

  # Stupid redirects:
  # Extra trailing slash
  '^https://(dprint\.dev|typescript-eslint\.io|eslint-plugin-package-json\.dev|ota-meshi\.github\.io/eslint-plugin-astro|sveltejs\.github\.io|github\.github\.com/gfm|nebrius\.github\.io/import-integrity-lint/rules|formatjs\.github\.io|e18e\.dev|qwik\.dev|tsdoc\.org|docs\.npmjs\.com|eslint\.org)(/[^#/][^#]*?)?/*(#[^/]*)?$ https://$1$2/$3',
  # Extra trailing slash, except on `.html` pages which are real files that 404
  # with a trailing slash. First-match wins, so the `.html` identity guard must
  # come before the slash rule (the `regex` crate has no lookahead to fold them)
  '^(https://(?:eslint-community|ota-meshi)\.github\.io/[^#]*\.html(?:#[^/]*)?)$ $1',
  '^(https://(?:eslint-community|ota-meshi)\.github\.io/[^#]*?)/*(#[^/]*)?$ $1/$2',
  # Extra trailing slash + www
  '^https://jsboundaries\.dev/(.*)/?(#[^/]*)?$ https://www.jsboundaries.dev/$1/$2',
]
# Merged into the baseline's `exclude` list.
exclude = [
  # TODO temporary - actually missing fragments for deprecated plugin settings, should remove links to them in future
  '^https://github\.com/schoero/eslint-plugin-better-tailwindcss/blob/HEAD/docs/settings/settings.md#\w+$',

  # These rule pages exist but the site wrongly answers with 404
  '^https://eslint-plugin-github-action\.ntnyq\.com/rules/[\w-]+/?$',

  # Fragments exist in the served HTML but this SSG host intermittently drops
  # page content under the concurrent load of a full run, so lychee reports them
  # as missing. Verified present when the URLs are checked in isolation
  '^https://eslint-react\.xyz/docs/configuration/configure-analyzer#[\w-]+$',
  '^https://eslint-react\.xyz/docs/rules#[\w-]+$',

  # Inserted by `all-contributors-cli` in README.md
  'README\.md#(example|ideas|infra|maintenance|tool)-[\w-]+$',
  '^https://all-contributors\.js\.org/docs/en/bot/usage$',

  # Link with a missing fragment inside an inline snapshot in test/configs/web-components/web-components.spec.ts
  '^https://html\.spec\.whatwg\.org/multipage/custom-elements\.html#prod-potentialcustomelementname$',

  # Location-dependent redirect
  '^https://aws\.amazon\.com/cdk$',

  # JS interpolations
  '^https?://.*\$%7[Bb]',

  # Template links from scripts/shared/packages-meta.ts
  '___INSERT-\w+-HERE___',
]
exclude_path = [
  # This file: lychee mistakes the regexes above for URLs to check
  '(^|[/\\])lychee\.toml$',
  # Generated by changesets
  '(^|[/\\])CHANGELOG\.md$',
  # Fixtures deliberately contain unreachable and malformed links
  '(^|[/\\])test[/\\](.*[/\\])?fixtures[/\\]',
  # Diffs of third-party packages, whose links are not ours to fix
  '(^|[/\\])patches[/\\]',
]
