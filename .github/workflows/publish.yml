name: Create release PR/Publish
on:
  push:
    branches:
      - main
      - dev-v1

permissions:
  contents: write
  pull-requests: write
  id-token: write # Required for Trusted Publishing

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release-main:
    name: Create release PR and publish on merge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/prepare
      - name: Install npm version supporting Trusted Publishing
        run: |
          # The npm bundled with the runner's Node.js may have missing internal
          # dependencies (e.g. `promise-retry`), making `npm install` itself crash.
          # Bootstrap by downloading the npm tarball directly and using that fresh
          # copy to perform the global install.
          NPM_VER=$(curl -fsSL https://registry.npmjs.org/-/package/npm/dist-tags | jq -r '.latest')
          curl -fsSL "https://registry.npmjs.org/npm/-/npm-${NPM_VER}.tgz" | tar -xzC /tmp/
          node /tmp/package/bin/npm-cli.js install --global "npm@${NPM_VER}"
      - name: Enter pre-release mode
        if: github.ref == 'refs/heads/dev-v1'
        # Should ignore an error happening if already in pre mode
        run: npx changeset pre enter beta || true
      # Based on https://github.com/changesets/action/issues/303#issuecomment-1888167265
      - name: Capture new release version
        run: |
          pnpm changeset version
          echo "NEW_VERSION=$(jq -r '.version' package.json)" >> $GITHUB_ENV
          git restore .
      - name: Create release PR OR Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          commitMode: github-api
          title: 'chore: release v${{ env.NEW_VERSION }}'
          commit: 'chore: release v${{ env.NEW_VERSION }}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
