name: CI matrix tests
on:
  workflow_call:
    inputs:
      node-version:
        required: true
        type: number
      eslint-version:
        required: true
        type: number

jobs:
  test-config:
    name: Test config (Node ${{ inputs.node-version }}, ESLint ${{ inputs.eslint-version }})
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/prepare
        with:
          node-version: ${{ inputs.node-version }}
      - run: pnpm i eslint@${{ inputs.eslint-version }}
      - run: pnpm test:config
  test-vitest:
    name: Test (Vitest) (Node ${{ inputs.node-version }}, ESLint ${{ inputs.eslint-version }})
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/prepare
        with:
          node-version: ${{ inputs.node-version }}
      - run: pnpm i eslint@${{ inputs.eslint-version }}
      - run: pnpm test:vitest
