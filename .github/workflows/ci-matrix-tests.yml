name: CI matrix tests
on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      node-version:
        required: true
        type: string
      allow-failure:
        required: false
        type: boolean
        default: false

jobs:
  test-config:
    name: Un config test
    runs-on: ${{ inputs.os }}
    continue-on-error: ${{ inputs.allow-failure }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/prepare
        with:
          node-version: ${{ inputs.node-version }}
      - run: pnpm check:config
  test-vitest:
    name: Vitest
    runs-on: ${{ inputs.os }}
    continue-on-error: ${{ inputs.allow-failure }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/prepare
        with:
          node-version: ${{ inputs.node-version }}
      - run: pnpm test:vitest
