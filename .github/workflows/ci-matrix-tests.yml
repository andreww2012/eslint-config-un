name: CI matrix tests
on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      node-version:
        required: true
        type: number

jobs:
  test-config:
    name: Un config test
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
        with:
          node-version: ${{ inputs.node-version }}
      - run: pnpm check:config
  test-vitest:
    name: Vitest
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
        with:
          node-version: ${{ inputs.node-version }}
      - run: pnpm test:vitest
