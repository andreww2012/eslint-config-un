# cspell:ignore EBADDEVENGINES
name: Check code (+ Publish)
on:
  pull_request:
  push:
    branches:
      - main
      - dev-v1

permissions:
  contents: write
  pull-requests: write
  id-token: write # Required for Trusted Publishing

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/prepare

  knip:
    name: Knip
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/prepare
      - run: pnpm knip

  spellcheck:
    name: Spellcheck (cspell)
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/prepare
      - run: pnpm spellcheck

  formatting:
    name: Formatting check (prettier)
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/prepare
      - run: pnpm format:check

  typecheck:
    name: Typecheck (tsgo)
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/prepare
      - run: pnpm lint:types:go

  eslint:
    name: ESLint
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/prepare
      - run: pnpm lint:eslint
        env:
          NODE_OPTIONS: --max-old-space-size=6144 # TODO investigate why high memory is needed

  test:
    name: Test (Node ${{ matrix.node-version }}, ESLint ${{ matrix.eslint-version }})
    needs: install
    strategy:
      matrix:
        node-version: [22, 24]
        eslint-version: [9, 10]
    uses: ./.github/workflows/ci-matrix-tests.yml
    with:
      node-version: ${{ matrix.node-version }}
      eslint-version: ${{ matrix.eslint-version }}

  build:
    name: Build (tsdown) & lint public types (attw)
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/prepare
      - run: |
          # `pnpm lint:public-types` uses `attw --pack` which internally calls `npm pack`.
          # The runner's bundled npm may have broken internal deps, causing `npm pack` to fail.
          # Pack via pnpm instead and pass the tarball directly to attw.
          pnpm pack --pack-destination /tmp
          pnpm exec attw /tmp/eslint-config-un-*.tgz --profile esm-only

  release-main:
    name: Create release PR _OR_ Publish on merge
    needs: [knip, spellcheck, formatting, typecheck, eslint, test, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/prepare
        with:
          install-npm: 'true'
      - name: Enter pre-release mode
        if: github.ref == 'refs/heads/dev-v1'
        # Should ignore an error happening if already in pre mode
        run: pnpm changeset pre enter beta || true
      # Based on https://github.com/changesets/action/issues/303#issuecomment-1888167265
      - name: Capture new release version
        run: |
          pnpm changeset version
          echo "NEW_VERSION=$(jq -r '.version' package.json)" >> $GITHUB_ENV
          git restore .
      # pnpm v11 has a bug with bundleDependencies (does not actually bundle them); use v10 only for publishing
      - name: Install pnpm 10 for publish
        run: |
          npm i --global pnpm@^10 --prefix /tmp/pnpm10
          echo "/tmp/pnpm10/bin" >> $GITHUB_PATH
      - name: Create release / Publish
        id: changesets
        uses: changesets/action@6a0a831ff30acef54f2c6aa1cbbc1096b066edaf # v1.7.0
        with:
          publish: pnpm release
          commitMode: github-api
          title: 'chore: release v${{ env.NEW_VERSION }}'
          commit: 'chore: release v${{ env.NEW_VERSION }}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_FORCE: true # To prevent potential EBADDEVENGINES npm fatal error
