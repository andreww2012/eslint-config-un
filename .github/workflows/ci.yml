name: Check code (+ Publish)
on:
  pull_request:
  push:
    branches:
      - main
      - dev-v1

permissions:
  contents: write
  pull-requests: write
  id-token: write # Required for Trusted Publishing

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare

  knip:
    name: Knip
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
      - run: pnpm knip

  spellcheck:
    name: Spelling
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
      - run: pnpm check:spelling

  formatting:
    name: Formatting
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
      - run: pnpm check:format

  typecheck:
    name: Types
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
      - run: pnpm ts

  eslint:
    name: ESLint
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
      - run: pnpm eslint

  type-info:
    name: Type information rules
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
      - run: pnpm check:type-info

  release-notes:
    name: Release notes size
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
      - run: pnpm check:release-notes

  check-links:
    name: Links checker
    needs: install
    uses: ./.github/workflows/check-links.yml

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    needs: install
    strategy:
      matrix:
        os: [ubuntu-24.04]
        node-version: &node-versions ['22', '24', &latest-node-version '26']
        include:
          # Only run Windows tests on the latest Node version because they're slower
          - os: windows-2025
            node-version: *latest-node-version
          # Reports problems with the next Node version early, without failing the run.
          # TODO Node 27 only has alpha releases until April 2027, so bump it to the newest one by hand
          - os: ubuntu-24.04
            node-version: 27.0.0-alpha.0.0.0
            allow-failure: true
    uses: ./.github/workflows/ci-matrix-tests.yml
    with:
      os: ${{ matrix.os }}
      node-version: ${{ matrix.node-version }}
      allow-failure: ${{ matrix.allow-failure || false }}

  e2e:
    name: E2E (${{ matrix.package-manager }})
    needs: install
    strategy:
      fail-fast: false
      matrix:
        package-manager:
          - npm
          - pnpm
          - pnpm-gvs
          - yarn-classic
          - yarn-berry-pnp
          - yarn-berry-pnp-workspace
          - yarn-berry-node-modules
          - bun
          - aube
          - aube-gvs
          - nub
          - upm
        # Wrapped in another list to be a single matrix value: the called workflow runs a job for
        node-versions: [*node-versions]
        include:
          - package-manager: deno
            node-versions: [*latest-node-version]
    uses: ./.github/workflows/ci-e2e-tests.yml
    with:
      package-manager: ${{ matrix.package-manager }}
      node-versions: ${{ toJSON(matrix.node-versions) }}

  build:
    name: Build
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
      - run: pnpm check:package

  release-main:
    name: Create release PR / Publish on merge
    needs:
      - knip
      - spellcheck
      - formatting
      - typecheck
      - eslint
      - release-notes
      - check-links
      - test
      - e2e
      - build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/prepare
      - name: Enter pre-release mode
        if: github.ref == 'refs/heads/dev-v1'
        # Should ignore an error happening if already in pre mode
        run: pnpm changeset pre enter rc || true
      # Based on https://github.com/changesets/action/issues/303#issuecomment-1888167265
      - name: Capture new release version
        env:
          # For the changelog generator, the action passes it on its own
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Exits with 1 if there are no unreleased changesets,
          # in which case the version stays the same
          pnpm changeset version || true
          echo "NEW_VERSION=$(jq -r '.version' package.json)" >> $GITHUB_ENV
          git restore .
          # `changeset version` moves versioned prerelease changesets to an untracked `.changeset/pre`
          git clean -fdq .changeset
      - name: Create release / Publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          publish-script: pnpm release
          pr-title: 'chore: release v${{ env.NEW_VERSION }}'
          commit-message: 'chore: release v${{ env.NEW_VERSION }}'
