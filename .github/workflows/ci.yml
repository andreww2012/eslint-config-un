name: Check code (+ Publish)
on:
  pull_request:
  push:
    branches:
      - main
      - dev-v1

permissions:
  contents: write
  pull-requests: write
  id-token: write # Required for Trusted Publishing

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare

  knip:
    name: Knip
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
      - run: pnpm knip

  spellcheck:
    name: Spellcheck (cspell)
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
      - run: pnpm check:spelling

  formatting:
    name: Formatting check (prettier)
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
      - run: pnpm check:format

  typecheck:
    name: Typecheck (tsgo)
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
      - run: pnpm ts

  eslint:
    name: ESLint
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
      - run: pnpm eslint

  check-links:
    name: Check links
    needs: install
    uses: ./.github/workflows/check-links.yml

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    needs: install
    strategy:
      matrix:
        os: [ubuntu-24.04]
        node-version: [22, 24, 26]
        # Only run Windows tests on the latest Node version
        include:
          - os: windows-2025
            node-version: 26
    uses: ./.github/workflows/ci-matrix-tests.yml
    with:
      os: ${{ matrix.os }}
      node-version: ${{ matrix.node-version }}

  build:
    name: Build (tsdown) & lint public types (attw)
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
      - run: |
          # `pnpm check:public-types` uses `attw --pack` which internally calls `npm pack`.
          # The runner's bundled npm may have broken internal deps, causing `npm pack` to fail.
          # Pack via pnpm instead and pass the tarball directly to attw.
          pnpm pack --pack-destination /tmp
          pnpm exec attw /tmp/eslint-config-un-*.tgz --profile esm-only

  release-main:
    name: Create release PR _OR_ Publish on merge
    needs: [knip, spellcheck, formatting, typecheck, eslint, check-links, test, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/prepare
      - name: Enter pre-release mode
        if: github.ref == 'refs/heads/dev-v1'
        # Should ignore an error happening if already in pre mode
        run: pnpm changeset pre enter rc || true
      # Based on https://github.com/changesets/action/issues/303#issuecomment-1888167265
      - name: Capture new release version
        run: |
          # Exits with 1 if there are no unreleased changesets, in which case the version stays the same
          pnpm changeset version || true
          echo "NEW_VERSION=$(jq -r '.version' package.json)" >> $GITHUB_ENV
          git restore .
          # `changeset version` moves the versioned prerelease changesets into an (untracked) `.changeset/pre` directory
          git clean -fdq .changeset
      - name: Create release / Publish
        id: changesets
        uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          publish-script: pnpm release
          pr-title: 'chore: release v${{ env.NEW_VERSION }}'
          commit-message: 'chore: release v${{ env.NEW_VERSION }}'
