name: Prepare
description: Prepares CI environment

inputs:
  node-version:
    description: Node.js version to use
    required: false
    default: '22'

runs:
  using: composite
  steps:
    - name: Read pnpm version from package.json
      id: pnpm-version
      shell: bash
      run: echo "version=$(jq -r '.devEngines.packageManager.version' package.json)" >> "$GITHUB_OUTPUT"
    - name: Setup pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        # TODO remove the explicit version after
        # https://github.com/pnpm/action-setup/issues/227 is fixed
        version: ${{ steps.pnpm-version.outputs.version }}
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        cache: pnpm
        node-version: ${{ inputs.node-version }}
        registry-url: https://registry.npmjs.org # Required for Trusted Publishing
    - name: Install dependencies
      shell: bash
      run: pnpm ci
    - name: Check deps for vulnerabilities & peer deps issues
      shell: bash
      run: pnpm check:deps
    # Shared only between the jobs of the same commit, as the artifacts depend on many source files.
    # Skipped on Windows: it can't restore caches saved on Linux, and its jobs run in parallel
    - name: Restore the generated artifacts
      id: artifacts-cache
      if: runner.os != 'Windows'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          src/**/*.gen.ts
          src/**/*.gen.d.ts
        key: generated-artifacts-${{ github.sha }}
    - name: Generate the artifacts
      if: steps.artifacts-cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm prep
