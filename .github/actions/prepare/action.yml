name: Prepare
description: Prepares CI environment

inputs:
  node-version:
    description: Node.js version to use
    required: false
    default: '22'
  install-npm:
    description: Install a working npm
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        cache: pnpm
        node-version: ${{ inputs.node-version }}
        registry-url: https://registry.npmjs.org # Required for Trusted Publishing
    - name: Install dependencies
      shell: bash
      run: pnpm -v && pnpm ci
    - name: Check deps for vulnerabilities
      shell: bash
      run: pnpm deps:audit
    - name: Cache typegen output
      id: cache-typegen
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        key: ${{ runner.os }}-${{ inputs.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}
        path: |
          src/*.gen.ts
          src/*.gen.d.ts
    - name: Run typegen
      shell: bash
      if: steps.cache-typegen.outputs.cache-hit != 'true'
      run: pnpm typegen
    - name: Install a working npm
      shell: bash
      if: inputs.install-npm == 'true'
      run: |
        # The npm bundled with the runner's Node.js may have missing internal
        # dependencies (e.g. `promise-retry`), making `npm install` itself crash.
        # Bootstrap by downloading the npm tarball directly and using that fresh
        # copy to perform the global install.
        NPM_VER=$(curl -fsSL https://registry.npmjs.org/-/package/npm/dist-tags | jq -r '.latest')
        curl -fsSL "https://registry.npmjs.org/npm/-/npm-${NPM_VER}.tgz" | tar -xzC /tmp/
        node /tmp/package/bin/npm-cli.js install --global "npm@${NPM_VER}"
